<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="970" viewBox="0 0 1536 970" role="img" aria-labelledby="title desc">
<title id="title">Kodi Lab architecture and data flow</title>
<desc id="desc">A high-level architecture diagram. A user browser connects to the Kodi Lab Web UI, and MCP-compatible AI clients connect to its MCP service. Shared orchestration and permissions manage existing external Kodi targets via JSON-RPC and optional Narrow Bridge, or four on-demand managed Kodi version profiles via a restricted broker. Managed instances feed noVNC and screen preview for browser viewing. Arrows indicate API/control flows and dashed display flows.</desc>
