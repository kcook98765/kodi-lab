{% extends 'base.html' %}
{% set nav_section = 'managed' %}
{% block title %}Managed Kodi · Kodi Lab{% endblock %}
{% block content %}
<h1>Managed Kodi</h1>
<section aria-labelledby="omega-heading" id="managed-omega" data-csrf="{{ csrf_token }}">
  <h2 id="omega-heading">Omega 21.3</h2>
  <p id="managed-status" role="status">Checking Kodi…</p>
  <div>
    <button type="button" data-action="managed_prepare">Prepare</button>
    <button type="button" data-action="managed_start">Start</button>
    <button type="button" data-action="managed_stop">Stop</button>
    <button type="button" data-action="managed_reset">Reset</button>
    <button type="button" data-action="managed_recover" hidden>Recover</button>
  </div>
  <p id="managed-feedback" role="status"></p>
  <section aria-labelledby="managed-snapshots-heading">
    <h3 id="managed-snapshots-heading">Snapshots</h3>
    <label for="managed-snapshot">Administrator snapshots</label>
    <select id="managed-snapshot"></select>
    <button type="button" data-action="snapshot_load">Load</button>
    <button type="button" data-action="snapshot_delete">Delete</button>
    <label for="managed-snapshot-name">New snapshot name</label>
    <input id="managed-snapshot-name" maxlength="64">
    <button type="button" data-action="snapshot_save">Save</button>
  </section>
  <section aria-labelledby="managed-view-heading">
    <h3 id="managed-view-heading">Kodi screen</h3>
    <button type="button" id="managed-view">View</button>
    <button type="button" id="managed-take-control">Take Control</button>
    <button type="button" id="managed-release-control">Release Control</button>
    <p id="managed-view-status" role="status"></p>
    <div id="managed-viewer" hidden></div>
  </section>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', path='/managed.js') }}"></script>{% endblock %}
