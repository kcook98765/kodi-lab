<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Kodi Lab</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <main class="login-panel">
      <h1>Kodi Lab</h1>
      {% if not credentials_configured %}
      <p class="notice">Administrator credentials are not configured. Run <code>kodi-lab-admin set-password</code> locally.</p>
      {% endif %}
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      {# Submit to the current URL so legacy bookmark fragments survive sign-in. #}
      <form method="post">
        <label for="password">Administrator password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
