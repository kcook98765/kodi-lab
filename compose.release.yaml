name: kodi-lab-remote

# Installed images only. Keep this file with the release bundle; it has no
# build context and can be used without a source checkout.
services:
  web:
    image: ${KODI_LAB_REMOTE_IMAGE:?run linux-v1-bundle configure first}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      KODI_LAB_WEB_ALLOWED_HOSTS: '["127.0.0.1"]'
      KODI_LAB_REPOSITORY_BASE_URL: ${KODI_LAB_REPOSITORY_BASE_URL:?configure repository first}
      KODI_LAB_REPOSITORY_DATA_ROOT: /srv/kodi-lab-repository
      KODI_LAB_REPOSITORY_BUNDLE_SHA256: ${KODI_LAB_REPOSITORY_BUNDLE_SHA256:?configure repository first}
      KODI_LAB_DEVELOPMENT_REPOSITORY_MAX_ARTIFACTS: ${KODI_LAB_DEVELOPMENT_REPOSITORY_MAX_ARTIFACTS:-128}
      KODI_LAB_DEVELOPMENT_REPOSITORY_MAX_BYTES: ${KODI_LAB_DEVELOPMENT_REPOSITORY_MAX_BYTES:-268435456}
    ports:
      - "127.0.0.1:${KODI_LAB_PUBLISHED_PORT:-18100}:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/login', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    volumes:
      - remote_state:/var/lib/kodi-lab
      - broker_socket:/run/kodi-lab:ro
      - repository_data:/srv/kodi-lab-repository

  repository:
    # The process listens inside its isolated container namespace. Host
    # publication is restricted to the explicit private-LAN address below.
    image: ${KODI_LAB_REMOTE_IMAGE:?run linux-v1-bundle configure first}
    entrypoint: [kodi-lab-repository]
    command: [serve]
    init: true
    read_only: true
    user: "10002:10002"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      KODI_LAB_REPOSITORY_DATA_ROOT: /srv/kodi-lab-repository
      KODI_LAB_REPOSITORY_BASE_URL: ${KODI_LAB_REPOSITORY_BASE_URL:?configure repository first}
      KODI_LAB_REPOSITORY_BUNDLE_SHA256: ${KODI_LAB_REPOSITORY_BUNDLE_SHA256:?configure repository first}
    ports:
      - "${KODI_LAB_REPOSITORY_BIND:?explicit private LAN bind required}:${KODI_LAB_REPOSITORY_PORT:?repository port required}:8110"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    volumes:
      - repository_data:/srv/kodi-lab-repository:ro

  repository-init:
    profiles: [repository-init]
    image: ${KODI_LAB_REMOTE_IMAGE:?run linux-v1-bundle configure first}
    entrypoint: [kodi-lab-repository]
    command: [generate]
    network_mode: none
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    environment:
      KODI_LAB_REPOSITORY_BASE_URL: ${KODI_LAB_REPOSITORY_BASE_URL:?configure repository first}
    volumes:
      - ./:/candidate:ro
      - repository_data:/srv/kodi-lab-repository

  repository-transition:
    profiles: [repository-transition]
    image: ${KODI_LAB_REMOTE_IMAGE:?run linux-v1-bundle configure first}
    entrypoint: [kodi-lab-repository, transition]
    network_mode: none
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment:
      KODI_LAB_REPOSITORY_BASE_URL: ${KODI_LAB_REPOSITORY_BASE_URL:?configure repository first}
      KODI_LAB_REPOSITORY_BUNDLE_SHA256: ${KODI_LAB_REPOSITORY_BUNDLE_SHA256:?configure repository first}
    volumes:
      - ./:/candidate:ro
      - repository_data:/srv/kodi-lab-repository
      - remote_state:/var/lib/kodi-lab

  broker:
    profiles:
      - lab
    image: ${KODI_LAB_BROKER_IMAGE:?run linux-v1-bundle configure first}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, kodi-lab-broker, --healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - broker_socket:/run/kodi-lab
      - remote_state:/var/lib/kodi-lab

volumes:
  remote_state:
  broker_socket:
  repository_data:
