[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kodi-lab"
version = "0.0.0"
description = "Self-hosted development and testing environment for isolated Kodi installations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kodi Lab contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=50,<51",
  "docker>=7.2,<8",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
  "mcp==2.1.1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
kodi-lab-admin = "kodi_lab.admin_cli:main"
kodi-lab-mcp-stdio = "kodi_lab.mcp.stdio_proxy:main"
kodi-lab-web = "kodi_lab.web.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kodi_lab"]

[tool.hatch.build]
artifacts = [
  "src/kodi_lab/fixtures/small-mixed-v2/payload/userdata/Database/MyVideos131.db",
  "src/kodi_lab/fixtures/small-mixed-v3/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/small-mixed-v4/payload/userdata/Database/MyVideos119.db",
  "src/kodi_lab/fixtures/small-movies-v1/payload/userdata/Database/MyVideos131.db",
  "src/kodi_lab/fixtures/small-movies-v2/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/small-movies-v3/payload/userdata/Database/MyVideos119.db",
  "src/kodi_lab/fixtures/small-tv-v1/payload/userdata/Database/MyVideos131.db",
  "src/kodi_lab/fixtures/small-tv-v2/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/small-tv-v3/payload/userdata/Database/MyVideos119.db",
  "src/kodi_lab/fixtures/medium-mixed-v1/payload/userdata/Database/MyVideos131.db",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: materially expensive lifecycle or end-to-end validation retained by the full gate",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
