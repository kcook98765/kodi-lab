[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kodi-lab"
version = "1.0.0rc1"
description = "Self-hosted development and testing environment for isolated Kodi installations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kodi Lab contributors" }]
license = "MIT"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=50,<51",
  "docker>=7.2,<8",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
  "mcp==2.1.1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
  "websockets>=17.1,<18",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pillow==13.0.0",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
kodi-lab-admin = "kodi_lab.admin_cli:main"
kodi-lab-mcp-stdio = "kodi_lab.mcp.stdio_proxy:main"
kodi-lab-web = "kodi_lab.web.run:main"
kodi-lab-broker = "kodi_lab.broker.run:main"
kodi-lab-broker-healthcheck = "kodi_lab.broker_health:main"
kodi-lab-runtime = "kodi_lab.runtime.distribution:main"
kodi-lab-lab = "kodi_lab.runtime.lab:main"
kodi-lab-repository = "kodi_lab.repository.server:main"

[project.optional-dependencies]
preview = [
    "pillow==13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kodi_lab"]

# One migration tree serves source checkouts and installed artifacts.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "kodi_lab/migrations"
"THIRD_PARTY_NOTICES.md" = "kodi_lab/THIRD_PARTY_NOTICES.md"
"bridge/service.kodi_lab_bridge/LICENSE" = "kodi_lab/kodi/bridge_source/LICENSE"
"bridge/service.kodi_lab_bridge/README.md" = "kodi_lab/kodi/bridge_source/README.md"
"bridge/service.kodi_lab_bridge/addon.xml" = "kodi_lab/kodi/bridge_source/addon.xml"
"bridge/service.kodi_lab_bridge/narrow_bridge.py" = "kodi_lab/kodi/bridge_source/narrow_bridge.py"
"bridge/service.kodi_lab_bridge/ui_observation.py" = "kodi_lab/kodi/bridge_source/ui_observation.py"
"bridge/service.kodi_lab_bridge/onboarding.py" = "kodi_lab/kodi/bridge_source/onboarding.py"
"bridge/service.kodi_lab_bridge/pairing_ui.py" = "kodi_lab/kodi/bridge_source/pairing_ui.py"
"bridge/service.kodi_lab_bridge/resources/language/resource.language.en_gb/strings.po" = "kodi_lab/kodi/bridge_source/resources/language/resource.language.en_gb/strings.po"
"bridge/service.kodi_lab_bridge/resources/settings.xml" = "kodi_lab/kodi/bridge_source/resources/settings.xml"
"bridge/service.kodi_lab_bridge/service.py" = "kodi_lab/kodi/bridge_source/service.py"

[tool.hatch.build]
artifacts = [
  "src/kodi_lab/fixtures/small-mixed-v2/payload/userdata/Database/MyVideos131.db",
  "src/kodi_lab/fixtures/small-mixed-v3/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/small-mixed-v4/payload/userdata/Database/MyVideos119.db",
  "src/kodi_lab/fixtures/small-mixed-v6/payload/userdata/Database/MyVideos119.db",
  "src/kodi_lab/fixtures/small-movies-v1/payload/userdata/Database/MyVideos131.db",
  "src/kodi_lab/fixtures/small-movies-v2/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/small-movies-v3/payload/userdata/Database/MyVideos119.db",
  "src/kodi_lab/fixtures/small-movies-v4/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/small-movies-v5/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/small-tv-v1/payload/userdata/Database/MyVideos131.db",
  "src/kodi_lab/fixtures/small-tv-v2/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/small-tv-v3/payload/userdata/Database/MyVideos119.db",
  "src/kodi_lab/fixtures/medium-mixed-v1/payload/userdata/Database/MyVideos131.db",
  "src/kodi_lab/fixtures/cross-movies-matrix-v1/payload/userdata/Database/MyVideos119.db",
  "src/kodi_lab/fixtures/cross-movies-nexus-v1/payload/userdata/Database/MyVideos121.db",
  "src/kodi_lab/fixtures/cross-movies-omega-v1/payload/userdata/Database/MyVideos131.db",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: materially expensive lifecycle or end-to-end validation retained by the full gate",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
# Standalone, hash-pinned runtime data mirrors. The canonical helpers remain
# checked; check each archived asset directory separately to avoid module-name
# collisions between scripts that are not importable application packages.
exclude = [
  '^src/kodi_lab/runtime/assembly_assets/omega-21\.3-novnc-phase1-r3/',
  '^src/kodi_lab/runtime/assembly_assets/omega-21\.3-novnc-phase2-r4/',
]
