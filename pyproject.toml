[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kodi-lab"
version = "0.0.0"
description = "Self-hosted development and testing environment for isolated Kodi installations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kodi Lab contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "docker>=7.2,<8",
  "fastapi>=0.116,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kodi_lab"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
